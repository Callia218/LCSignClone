name: LCSignClone

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    GCC_ENABLE_CPP_EXCEPTIONS: YES
    GCC_ENABLE_CPP_RTTI: YES
    # 首次运行请改成你自己的 Team ID，或留空走自动签名
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  # zsign 依赖 OpenSSL。用 SwiftPM 引入，Xcode 会自动处理 iOS 版链接，
  # 省掉自己交叉编译 OpenSSL 的麻烦。
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL
    from: 3.6.0

targets:

  # ---------------------------------------------------------------
  # 核心层：签名逻辑，不含 UI
  # ---------------------------------------------------------------
  LCSignCore:
    type: framework
    platform: iOS
    sources:
      # 一把梭全收：Swift 源码 + ObjC++ 桥接 + include/ 下的公开头文件。
      # headerVisibility 默认就是 public，显式写出来是为了别让以后有人改错。
      - path: Sources/LCSignCore
        headerVisibility: public
    dependencies:
      - package: ZIPFoundation
      - package: OpenSSL
        product: OpenSSL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lcsigncore
        PRODUCT_NAME: LCSignCore
        # 让 Xcode 自动合成 Info.plist。
        # 不设这个的话 framework 里**不会有 Info.plist**，是个畸形 bundle：
        # 重签名时 zsign 要从里面读 CFBundleIdentifier 来给嵌套框架生成
        # 签名标识，读不到就只能签出一个 iOS 拒绝加载的框架。
        GENERATE_INFOPLIST_FILE: YES
        # 混合语言 framework 的关键开关：置 Yes 后 Xcode 会为 framework 生成
        # 模块映射，并把 include/LCSignCore.h 当作伞形头文件 —— Swift 侧因此
        # 能直接看到 ZSignBridge，而不需要（framework 也不支持）桥接头。
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        # 头文件搜索路径。桥接层只 include zsign_shim.h（纯 C），zsign 的 C++
        # 头文件依赖（bundle.h / openssl.h / json.h）被封在静态库内部，不会漏进来。
        #   - Vendor/zsign/include   由 10_build_zsign.sh 拷出来的产物
        #   - Scripts/zsign_shim     shim 的源头，脚本没跑时也能兜住
        #   - Sources/.../include    ZSignBridge.h 与伞形头文件所在目录
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/zsign/include"
          - "$(SRCROOT)/Scripts/zsign_shim"
          - "$(SRCROOT)/Sources/LCSignCore/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/zsign/lib"
        # OpenSSL 由 SwiftPM 提供；这里链接 zsign 静态库、C++ 运行时与压缩库
        OTHER_LDFLAGS:
          - "-lzsign"
          - "-lc++"
          - "-lz"
          - "-lbz2"
        CLANG_ENABLE_OBJC_ARC: YES

  # ---------------------------------------------------------------
  # UI 层：SwiftUI App
  # ---------------------------------------------------------------
  LCSignClone:
    type: application
    platform: iOS
    sources:
      - path: Sources/LCSignClone
    dependencies:
      - target: LCSignCore
    info:
      path: Sources/LCSignClone/Info.plist
      properties:
        CFBundleDisplayName: LCSign
        CFBundleName: LCSignClone
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 让「文件」App 能直接投递 IPA 进来
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.apple.itunes.ipa
              - public.archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App Archive
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lcsignclone
        PRODUCT_NAME: LCSignClone
        TARGETED_DEVICE_FAMILY: "1,2"
