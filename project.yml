name: LCSignClone

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    GCC_ENABLE_CPP_EXCEPTIONS: YES
    GCC_ENABLE_CPP_RTTI: YES
    # 首次运行请改成你自己的 Team ID，或留空走自动签名
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  # zsign 依赖 OpenSSL。用 SwiftPM 引入，Xcode 会自动处理 iOS 版链接，
  # 省掉自己交叉编译 OpenSSL 的麻烦。
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL
    from: 3.6.0

targets:

  # ---------------------------------------------------------------
  # 核心层：签名逻辑，不含 UI
  # ---------------------------------------------------------------
  LCSignCore:
    type: framework
    platform: iOS
    sources:
      # 一把梭全收：Swift 源码 + ObjC++ 桥接 + include/ 下的公开头文件。
      # headerVisibility 默认就是 public，显式写出来是为了别让以后有人改错。
      - path: Sources/LCSignCore
        headerVisibility: public
    dependencies:
      - package: ZIPFoundation
      - package: OpenSSL
        product: OpenSSL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lcsigncore
        PRODUCT_NAME: LCSignCore
        # 让 Xcode 自动合成 Info.plist。
        # 不设这个的话 framework 里**不会有 Info.plist**，是个畸形 bundle：
        # 重签名时 zsign 要从里面读 CFBundleIdentifier 来给嵌套框架生成
        # 签名标识，读不到就只能签出一个 iOS 拒绝加载的框架。
        GENERATE_INFOPLIST_FILE: YES
        # 混合语言 framework 的关键开关：置 Yes 后 Xcode 会为 framework 生成
        # 模块映射，并把 include/LCSignCore.h 当作伞形头文件 —— Swift 侧因此
        # 能直接看到 ZSignBridge，而不需要（framework 也不支持）桥接头。
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        # 头文件搜索路径。桥接层只 include zsign_shim.h（纯 C），zsign 的 C++
        # 头文件依赖（bundle.h / openssl.h / json.h）被封在静态库内部，不会漏进来。
        #   - Vendor/zsign/include   由 10_build_zsign.sh 拷出来的产物
        #   - Scripts/zsign_shim     shim 的源头，脚本没跑时也能兜住
        #   - Sources/.../include    ZSignBridge.h 与伞形头文件所在目录
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/zsign/include"
          - "$(SRCROOT)/Scripts/zsign_shim"
          - "$(SRCROOT)/Sources/LCSignCore/include"
        # 10_build_zsign.sh 按平台分别产出静态库，这里用 $(PLATFORM_NAME)
        # 取对应那一份（真机 iphoneos / 模拟器 iphonesimulator）。
        # 不分开的话模拟器链接会因为「device-only 目标文件」直接失败。
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/zsign/lib/$(PLATFORM_NAME)"
        # OpenSSL 由 SwiftPM 提供；这里链接 zsign 静态库、C++ 运行时与压缩库
        OTHER_LDFLAGS:
          - "-lzsign"
          - "-lc++"
          - "-lz"
          - "-lbz2"
        CLANG_ENABLE_OBJC_ARC: YES

  # ---------------------------------------------------------------
  # UI 层：SwiftUI App
  # ---------------------------------------------------------------
  LCSignClone:
    type: application
    platform: iOS
    sources:
      - path: Sources/LCSignClone
    dependencies:
      - target: LCSignCore
      # ---- OpenSSL 必须在这里再声明一次 ----
      #
      # SwiftPM 的 OpenSSL 产物是**动态框架**（OpenSSL.xcframework 里就是
      # OpenSSL.framework），LCSignCore 链接了它，所以 App 包里必须有它。
      #
      # 只声明在 LCSignCore 上是不够的：Xcode **不会**递归嵌入「被嵌入框架」
      # 的动态依赖，于是没有任何 target 负责把它拷进 .app/Frameworks。
      # 症状极具迷惑性 —— xcodebuild 一切正常、IPA 也能正常打出来，
      # 但装到设备上一打开就被 dyld 终止：
      #
      #   termination: namespace=DYLD, indicator="Library missing"
      #   Library not loaded: @rpath/OpenSSL.framework/OpenSSL
      #   Referenced from: .../LCSignCore.framework/LCSignCore
      #
      # 在 application target 上声明后，Xcode 会自己把 xcframework
      # binaryTarget 嵌进 .app/Frameworks/（实测日志里源路径就是
      # SourcePackages/checkouts/OpenSSL/Frameworks/OpenSSL.xcframework/
      # ios-arm64/OpenSSL.framework）。
      #
      # ！！这里**不要**写 `embed: true` ！！
      # XcodeGen 的 embed 条目生成的是 productRef 形式的构建文件
      # （PBXBuildFile(product:) → productRef，见 XcodeProj 的
      # PBXBuildFile.swift），放进 Embed Frameworks 阶段后 Xcode 会把产品名
      # 当成字面路径去找 $(BUILT_PRODUCTS_DIR)/OpenSSL —— 而真实产物在
      # PackageFrameworks/OpenSSL.framework，于是直接报：
      #
      #   error: .../Release-iphoneos/OpenSSL: No such file or directory
      #
      # 也就是说 embed: true 会与 Xcode 自己的嵌入**重复**，且它那条是坏的。
      # 让 Xcode 自己处理即可；Scripts/30_verify_bundle.py 会在 CI 里
      # 把「没嵌进去」这类问题拦下来。
      - package: OpenSSL
        product: OpenSSL
    info:
      path: Sources/LCSignClone/Info.plist
      properties:
        CFBundleDisplayName: LCSign
        CFBundleName: LCSignClone
        CFBundleShortVersionString: "1.0"
        # 每次出可安装的包都往上加 1，方便在设备上和崩溃日志里区分版本
        # 1 = 首个可安装包
        # 2 = 修掉 OpenSSL 动态框架没嵌进包导致的启动闪退
        # 3 = 界面重做 + 打包改成 O(n) + 修掉真机自检「解包 IPA」误报
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 让「文件」App 能直接投递 IPA 进来
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.apple.itunes.ipa
              - public.archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App Archive
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lcsignclone
        PRODUCT_NAME: LCSignClone
        TARGETED_DEVICE_FAMILY: "1,2"

  # ---------------------------------------------------------------
  # 测试：只测 LCSignCore 的纯逻辑与签名链路
  #
  # 刻意**不挂宿主 App**（不设 TEST_HOST）。挂了宿主就得先起一遍 SwiftUI，
  # 跑得慢还容易因为界面问题连坐；而这里要验证的东西（描述文件解析、
  # entitlements 比对、IPA 往返、签名引擎）全都不需要界面。
  # 代价是 LCSignCore.framework 得嵌进测试 bundle 里，靠 LD_RUNPATH 找到。
  # ---------------------------------------------------------------
  LCSignCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LCSignCoreTests
    dependencies:
      - target: LCSignCore
        embed: true
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lcsigncore.tests
        PRODUCT_NAME: LCSignCoreTests
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.9"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

# ---------------------------------------------------------------
# 显式声明 scheme，别依赖 XcodeGen 的自动生成 ——
# CI 里用 `xcodebuild -scheme LCSignClone`，scheme 不在磁盘上就直接失败。
# ---------------------------------------------------------------
schemes:
  LCSignClone:
    build:
      targets:
        LCSignClone: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: LCSignCoreTests
