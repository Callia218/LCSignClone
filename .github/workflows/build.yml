name: Build IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 iOS App
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          echo "可用 Xcode："
          ls -d /Applications/Xcode*.app
          # 必须用最新的 Xcode：xcodegen 2.46 生成的是 Xcode 16 的工程格式
          # (objectVersion 77)，Xcode 15 会报 "future Xcode project file format"。
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "选用：$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装构建工具
        run: |
          # pkg-config 是必需的：zsign 的 macOS Makefile 靠它定位 OpenSSL
          brew install xcodegen openssl@3 pkg-config
          # openssl@3 是 keg-only，pkg-config 默认看不到，得手动指路
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: 编译 zsign 静态库
        run: bash Scripts/10_build_zsign.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 App（不签名）
        run: |
          # pipefail 不能省：否则管道的退出码取自末尾的 tail，
          # xcodebuild 失败会被吞掉，要到下一步才发现产物不存在
          set -o pipefail
          xcodebuild \
            -project LCSignClone.xcodeproj \
            -scheme LCSignClone \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -60

      - name: 打包未签名 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/LCSignClone.app"
          if [ ! -d "$APP" ]; then
            echo "::error::构建产物不存在，看上面的 xcodebuild 输出"
            exit 1
          fi
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          ( cd out && zip -qry ../LCSignClone-unsigned.ipa Payload )
          ls -lh LCSignClone-unsigned.ipa

      # 放在打包之后、上传之前，是刻意的：包不完整就不该被发出去。
      # 这一步拦的是「链接得上但打包后运行时找不到」的动态依赖
      # （踩过一次：SwiftPM 的 OpenSSL 是动态框架，没被嵌进 App 包，
      #  装到设备上启动即退，报 DYLD "Library missing"）。
      - name: 校验包完整性
        run: python3 Scripts/30_verify_bundle.py LCSignClone-unsigned.ipa

      - name: 检查签名密钥是否已配置
        id: cert
        run: |
          if [ -n "${{ secrets.P12_BASE64 }}" ] && [ -n "${{ secrets.PROVISION_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名密钥，只产出未签名 IPA"
          fi

      - name: 用证书签名
        if: steps.cert.outputs.available == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          # 可选。描述文件的 App ID 覆盖不了 com.example.lcsignclone 时，
          # 在 Settings → Secrets and variables → Actions → Variables 里
          # 加一个 BUNDLE_ID 变量，指定一个被描述文件覆盖的 Bundle ID。
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
        run: |
          # 兼容不同平台的 base64：macOS 老版本用 -D，GNU 用 -d
          b64decode() {
            base64 -d > "$1" 2>/dev/null || base64 -D > "$1" 2>/dev/null || base64 --decode > "$1"
          }

          printf '%s' "$P12_BASE64" | b64decode cert.p12
          printf '%s' "$PROVISION_BASE64" | b64decode profile.mobileprovision

          if [ ! -s cert.p12 ]; then
            echo "::error::P12_BASE64 解码后为空，检查 Secret 是否填对"
            exit 1
          fi
          if [ ! -s profile.mobileprovision ]; then
            echo "::error::PROVISION_BASE64 解码后为空，检查 Secret 是否填对"
            exit 1
          fi
          ls -l cert.p12 profile.mobileprovision

          extra=()
          if [ -n "$BUNDLE_ID" ]; then extra+=(--bundle-id "$BUNDLE_ID"); fi

          bash Scripts/20_resign_cli.sh \
            --ipa  LCSignClone-unsigned.ipa \
            --p12  cert.p12 \
            --pass "$P12_PASSWORD" \
            --prov profile.mobileprovision \
            "${extra[@]}" \
            --out  LCSignClone-signed.ipa

          rm -f cert.p12 profile.mobileprovision
          ls -lh LCSignClone-signed.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LCSignClone-ipa
          path: |
            LCSignClone-unsigned.ipa
            LCSignClone-signed.ipa
          if-no-files-found: error
          retention-days: 30

      # 放在上传产物之后：测试红了也要先把 IPA 留下来，
      # 否则一次测试失败就把可用的包一起吞了。
      - name: 运行单元测试
        run: |
          set -o pipefail

          # 动态挑一个可用的 iPhone 模拟器。
          # 写死机型名（比如 "iPhone 15"）在 runner 镜像更新后就会找不到设备，
          # 属于典型的「昨天还好好的」故障。
          DEVICE_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys

          devices = json.load(sys.stdin)["devices"]

          # 运行时 key 形如 com.apple.CoreSimulator.SimRuntime.iOS-18-2，
          # 倒序排一下就能先拿到最新那个 iOS
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)

          sys.exit("找不到可用的 iPhone 模拟器")
          ')"

          echo "使用模拟器：$DEVICE_ID"

          xcodebuild test \
            -project LCSignClone.xcodeproj \
            -scheme LCSignClone \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build-test \
            2>&1 | tee test.log | tail -120

      - name: 构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 7
